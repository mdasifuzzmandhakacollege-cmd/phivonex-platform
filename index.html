    <script>
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.indexOf('websocket') !== -1 || str.indexOf('failed to connect') !== -1 || str.indexOf('closed without opened') !== -1;
        }
        function isChunkError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.indexOf('loading chunk') !== -1 || str.indexOf('failed to fetch dynamically imported module') !== -1 || str.indexOf('importing a module script failed') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopPropagation();
          } else if (isChunkError(msg)) {
            console.warn('[PHIVONEX] Deployment chunk mismatch detected. Auto-refreshing...');
            if (!sessionStorage.getItem('phx_chunk_reloaded')) {
              sessionStorage.setItem('phx_chunk_reloaded', '1');
              window.location.reload();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopPropagation();
          } else if (isChunkError(msg)) {
            console.warn('[PHIVONEX] Deployment chunk mismatch error. Auto-refreshing...');
            if (!sessionStorage.getItem('phx_chunk_reloaded')) {
              sessionStorage.setItem('phx_chunk_reloaded', '1');
              window.location.reload();
            }
          }
        }, true);
      })();
    </script>
