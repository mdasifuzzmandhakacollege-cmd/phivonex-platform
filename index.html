    <script>
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.indexOf('websocket') !== -1 || str.indexOf('failed to connect') !== -1 || str.indexOf('closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
