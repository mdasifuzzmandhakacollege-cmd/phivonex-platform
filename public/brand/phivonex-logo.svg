<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0088FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0044AA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C38" />
      <stop offset="40%" stop-color="#060E1E" />
      <stop offset="100%" stop-color="#02050B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80EAFF" />
      <stop offset="30%" stop-color="#00CFFF" />
      <stop offset="70%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00CFFF" />
    </linearGradient>
    <linearGradient id="outerArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80EAFF" />
      <stop offset="35%" stop-color="#00CFFF" />
      <stop offset="70%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF" />
      <stop offset="50%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3F4FF" />
      <stop offset="50%" stop-color="#00CFFF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <linearGradient id="foldShadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002b66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#001133" stop-opacity="0.4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#aura)" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#tileBg)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#neonGlow)" />
  <path d="M 64 68 C 160 40, 352 40, 448 68" stroke="#80EAFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <g transform="translate(15, 12)">
    <!-- STEM -->
    <path d="M 130 100 L 190 100 L 190 320 L 130 400 L 130 100 Z" fill="url(#stemGrad)" />
    <path d="M 130 400 L 190 320 L 190 230 L 130 230 Z" fill="url(#foldShadow)" />

    <!-- OUTER ARCH LOOP -->
    <path d="M 190 100 L 250 100 C 330 100, 390 140, 390 200 C 390 260, 320 300, 240 300 L 190 300 L 250 240 C 290 240, 330 220, 330 190 C 330 160, 290 145, 240 145 L 190 145 Z" fill="url(#outerArch)" />

    <!-- INNER CHEVRON ARROW -->
    <path d="M 210 145 L 290 200 L 210 255 L 250 255 L 330 200 L 250 145 Z" fill="url(#chevronGrad)" />

    <!-- LOWER RETURN FOLD -->
    <path d="M 190 300 L 240 300 C 300 300, 340 270, 360 235 L 315 210 C 295 230, 260 245, 220 245 L 190 245 Z" fill="url(#outerArch)" opacity="0.9" />

    <!-- SPECULAR RIM LINES -->
    <path d="M 130 100 L 190 100 L 250 100 C 330 100, 390 140, 390 200" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 210 145 L 290 200 L 210 255" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.95" />
    <path d="M 130 100 L 130 400" stroke="#80EAFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
