<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" fill="none" width="100%" height="100%">
  <!-- Re-uses dark optimized vectors -->
  <defs>
    <radialGradient id="pxHLogoAuraD" cx="120" cy="120" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.25" />
