# Firebase App Hosting Configuration
runConfig:
  minInstances: 1
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: "production"
  - variable: APP_ENV
    value: "production"
  - variable: BSC_CHAIN_ID
    value: "56"
  - variable: DEPOSIT_CONFIRMATIONS
    value: "3"
  - variable: USDT_CONTRACT_ADDRESS
    value: "0x55d398326f99059ff775485246999027b3197955"
  - variable: WITHDRAWALS_ENABLED
    value: "false"

  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: DEPOSIT_ADDRESS_XPUB
    secret: DEPOSIT_ADDRESS_XPUB
  - variable: TREASURY_WALLET_ADDRESS
    secret: TREASURY_WALLET_ADDRESS
  - variable: BSC_RPC_URL_PRIMARY
    secret: BSC_RPC_URL_PRIMARY
  - variable: BSC_RPC_URL_SECONDARY
    secret: BSC_RPC_URL_SECONDARY
